# Runs lint/format (Biome) + typecheck (tsc) on every push and PR. This repo
# has no test suite, so those two are the whole gate -- same shape as
# borrowbetter-lpb, which set the precedent for a no-tests repo.
#
# The required status check for the org is the `ci` job at the bottom, not the
# work job above it. See org-require-ci in BorrowBetter/terraform-github.
#
# Release/publish is deliberately NOT here: this package goes to npm via
# publish.sh, run by hand. This workflow is the PR gate only.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No .nvmrc or .node-version in this repo, so the version is pinned
      # inline (package.json only says engines.node >=18). Matches lpb.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # npm, not pnpm -- this repo has package-lock.json and no pnpm lockfile.
      - run: npm ci

      # `format:check` is `biome ci`, which covers the linter, the formatter
      # and import sorting in one pass, so there is no separate lint step.
      - run: npm run format:check

      - run: npm run typecheck

  # The org ruleset requires exactly one context, `ci`, across every repo.
  # Repos do not agree on what they run, so they agree on the name of the job
  # that reports -- this one fans in whatever runs above, and jobs can be added
  # or split without touching the ruleset.
  #
  # Must stay a plain job. If this instead called a reusable workflow it would
  # report as `ci / <inner job>` and would never match the required context.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED when a
  # dependency fails, and a skipped check does not fail a required status check
  # -- the gate would go green exactly when lint or typecheck broke.
  #
  # The condition deliberately ignores `skipped`, which is safe only because
  # every job in `needs` runs unconditionally. Give one of them an `if:` or a
  # path filter and add 'skipped' here too, or an upstream skip passes the gate.
  ci:
    # Explicit, even though it matches the job id -- this string is the org
    # ruleset's required context, so it must not silently follow a rename.
    name: ci
    needs: [lint-typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on upstream jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
